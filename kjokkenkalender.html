<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kjøkkenkalender</title>
<style>
:root{
  --bg:#f5f2ec;--card:#ffffff;--text:#1c1a17;--muted:#716b61;--line:#e7e1d6;
  --accent:#c2410c;--today:#fff6ec;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
:root[data-theme=dark]{
  --bg:#12110e;--card:#1c1a16;--text:#f2eee7;--muted:#9b9489;--line:#2c2924;
  --accent:#fb923c;--today:#251e15;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* Header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:20px 28px 12px}
.clock{font-size:clamp(48px,8vw,104px);font-weight:600;letter-spacing:-.03em;line-height:.9;font-variant-numeric:tabular-nums}
.date{font-size:clamp(18px,2.2vw,28px);margin-top:8px;text-transform:capitalize}
.date small{color:var(--muted);font-size:.7em;margin-left:10px;text-transform:none}
.hright{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;cursor:pointer;
  display:grid;place-items:center;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px}
.dot.warn{background:#f59e0b}.dot.err{background:#ef4444}

/* Layout */
main{display:grid;grid-template-columns:minmax(300px,1.15fr) 2fr;gap:20px;padding:8px 28px 28px;min-height:calc(100vh - 160px)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);min-width:0}
.today{background:var(--today)}
.ptitle{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start}
.day h3{margin:0 0 10px;font-size:18px;text-transform:capitalize;display:flex;justify-content:space-between;align-items:baseline}
.day h3 span{color:var(--muted);font-size:13px;font-weight:500}
.empty{color:var(--muted);font-size:15px;padding:6px 0}

/* Events */
.ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.bar{width:4px;border-radius:4px;flex:none}
.ev .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .n{font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.ev .l{font-size:12px;color:var(--muted);margin-top:2px}
.ev.past{opacity:.4}
.today .ev{padding:12px 0}
.today .ev .n{font-size:22px;font-weight:500}
.today .ev .t{font-size:16px}
.ev.now .t{color:var(--accent);font-weight:600}
.allday{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{font-size:13px;padding:4px 10px;border-radius:999px;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today .pill{font-size:16px;padding:6px 12px}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--card);color:var(--text);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--line)}
.sheet h2{margin:0 0 6px;font-size:22px}
.sheet p{color:var(--muted);margin:0 0 16px;line-height:1.5;font-size:15px}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
input[type=text],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
code{background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);cursor:pointer;font-weight:600}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.cal{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.cal input{width:20px;height:20px}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.warnbox{background:#fef3c7;color:#78350f;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.banner{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:12px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:5;font-size:15px}
.banner button{background:var(--bg);color:var(--text);border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}

@media (max-width:820px){
  header{padding:16px 16px 8px}
  main{grid-template-columns:1fr;padding:8px 16px 16px}
  .days{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>
  <div class="hright">
    <span id="sync"></span>
    <button class="iconbtn" id="refreshBtn" title="Oppdater" aria-label="Oppdater">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="iconbtn" id="settingsBtn" title="Innstillinger" aria-label="Innstillinger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="main" class="hidden">
  <section class="panel today">
    <h2 class="ptitle">I dag</h2>
    <div id="todayList"></div>
  </section>
  <section>
    <div class="days" id="days"></div>
  </section>
</main>

<!-- Innlogging / oppsett -->
<div class="overlay hidden" id="setup">
  <div class="sheet">
    <h2>Kjøkkenkalender</h2>
    <p>Logg inn med Google-kontoen som har tilgang til familiens kalendere.</p>
    <div class="warnbox hidden" id="fileWarn">Siden er åpnet som lokal fil. Google-innlogging krever at siden ligger på en nettadresse (https eller http://localhost).</div>
    <div class="warnbox hidden" id="authErr"></div>
    <div id="clientBlock">
      <label class="f" for="clientId">Google OAuth Client ID</label>
      <input type="text" id="clientId" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
      <label class="f">Registrer denne adressen i Google Cloud (både JavaScript origin og redirect URI)</label>
      <p style="margin:0"><code id="originTxt"></code><br><code id="redirectTxt" style="display:inline-block;margin-top:6px"></code></p>
    </div>
    <div class="row">
      <button class="btn primary" id="loginBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Logg inn med Google
      </button>
    </div>
  </div>
</div>

<!-- Innstillinger -->
<div class="overlay hidden" id="settings">
  <div class="sheet">
    <h2>Innstillinger</h2>
    <label class="f">Kalendere som vises</label>
    <div id="calList"></div>
    <label class="f" for="daysSel">Antall dager</label>
    <select id="daysSel"><option value="5">5 dager</option><option value="7">7 dager</option><option value="10">10 dager</option><option value="14">14 dager</option></select>
    <label class="f" for="themeSel">Tema</label>
    <select id="themeSel"><option value="auto">Automatisk (mørkt kl. 21–06)</option><option value="light">Lyst</option><option value="dark">Mørkt</option></select>
    <div class="row">
      <button class="btn primary" id="saveBtn">Lagre</button>
      <button class="btn" id="fsBtn">Fullskjerm</button>
      <button class="btn" id="logoutBtn">Logg ut</button>
    </div>
  </div>
</div>

<div class="banner hidden" id="banner"><span>Innloggingen har utløpt.</span><button id="bannerBtn">Logg inn</button></div>

<script>
(() => {
'use strict';
const SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
const API = 'https://www.googleapis.com/calendar/v3/';
const REFRESH_MS = 5 * 60 * 1000;

// ---------- Lagring ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const S = {
  clientId: LS.get('kk.clientId', ''),
  token: LS.get('kk.token', null),
  selected: LS.get('kk.selected', null),
  days: LS.get('kk.days', 7),
  theme: LS.get('kk.theme', 'auto'),
  calendars: [],
  events: [],
  lastSync: null,
  syncError: false,
  authError: null
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- Datohjelpere ----------
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmtT = d => d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}

// ---------- Google-innlogging (OAuth 2.0, token via redirect) ----------
const redirectUri = () => location.origin + location.pathname;

function login(silent) {
  if (!S.clientId) { showSetup(); return; }
  const st = Math.random().toString(36).slice(2);
  LS.set('kk.state', st);
  LS.set('kk.silent', !!silent);
  const p = new URLSearchParams({
    client_id: S.clientId,
    redirect_uri: redirectUri(),
    response_type: 'token',
    scope: SCOPE,
    include_granted_scopes: 'true',
    state: st
  });
  if (silent) p.set('prompt', 'none');
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + p.toString();
}

function handleRedirect() {
  if (!location.hash || location.hash.length < 2) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('access_token') && !h.get('error')) return;
  history.replaceState(null, '', redirectUri());
  const wasSilent = LS.get('kk.silent', false);
  if (h.get('state') !== LS.get('kk.state', null)) return;
  LS.del('kk.state');
  if (h.get('access_token')) {
    S.token = { v: h.get('access_token'), exp: Date.now() + (parseInt(h.get('expires_in'), 10) || 3600) * 1000 };
    LS.set('kk.token', S.token);
    LS.del('kk.silentFailed');
  } else {
    S.authError = h.get('error');
    if (wasSilent) LS.set('kk.silentFailed', Date.now());
  }
}

const tokenValid = () => S.token && S.token.exp - Date.now() > 60 * 1000;

let renewTimer = null;
function scheduleRenew() {
  clearTimeout(renewTimer);
  if (!S.token) return;
  const ms = Math.max(5000, S.token.exp - Date.now() - 5 * 60 * 1000);
  renewTimer = setTimeout(() => login(true), ms);
}

function logout() {
  if (S.token) {
    try { fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(S.token.v), { method: 'POST', mode: 'no-cors' }); } catch (e) {}
  }
  S.token = null; LS.del('kk.token');
  S.events = []; S.calendars = [];
  $('settings').classList.add('hidden');
  $('main').classList.add('hidden');
  showSetup();
}

// ---------- Google Calendar API ----------
async function api(path, params) {
  const u = new URL(API + path);
  if (params) for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const r = await fetch(u, { headers: { Authorization: 'Bearer ' + S.token.v } });
  if (r.status === 401) {
    S.token = null; LS.del('kk.token');
    authLost();
    throw new Error('auth');
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadCalendars() {
  const d = await api('users/me/calendarList', { maxResults: '250' });
  S.calendars = (d.items || []).map(c => ({
    id: c.id,
    name: c.summaryOverride || c.summary,
    color: c.backgroundColor || '#64748b',
    primary: !!c.primary,
    visible: !!c.selected
  })).sort((a, b) => (b.primary - a.primary) || a.name.localeCompare(b.name, 'nb'));
  if (!S.selected) {
    S.selected = S.calendars.filter(c => c.primary || c.visible).map(c => c.id);
    LS.set('kk.selected', S.selected);
  }
}

function norm(e, cal) {
  const allDay = !!e.start.date;
  return {
    title: e.summary || '(uten tittel)',
    loc: e.location || '',
    allDay,
    start: allDay ? parseDate(e.start.date) : new Date(e.start.dateTime),
    end: allDay ? parseDate(e.end.date) : new Date(e.end.dateTime),
    color: cal.color
  };
}

async function loadEvents() {
  const start = sod(new Date());
  const end = addDays(start, S.days);
  const cals = S.calendars.filter(c => S.selected.includes(c.id));
  let failed = 0;
  const lists = await Promise.all(cals.map(c =>
    api('calendars/' + encodeURIComponent(c.id) + '/events', {
      timeMin: start.toISOString(), timeMax: end.toISOString(),
      singleEvents: 'true', orderBy: 'startTime', maxResults: '250'
    }).then(d => (d.items || []).filter(e => e.status !== 'cancelled' && e.start).map(e => norm(e, c)))
      .catch(err => { failed++; if (err.message === 'auth') throw err; return []; })
  ));
  S.events = lists.flat();
  S.lastSync = new Date();
  S.syncError = failed > 0;
}

let syncing = false;
async function sync(full) {
  if (syncing || !tokenValid()) return;
  syncing = true;
  try {
    if (full || !S.calendars.length) await loadCalendars();
    await loadEvents();
  } catch (e) {
    if (e.message !== 'auth') S.syncError = true;
  } finally {
    syncing = false;
    render();
  }
}

// ---------- Visning ----------
function eventsFor(day) {
  const ds = day, de = addDays(day, 1);
  return S.events
    .filter(e => e.start < de && e.end > ds)
    .sort((a, b) => (b.allDay - a.allDay) || (a.start - b.start) || a.title.localeCompare(b.title, 'nb'));
}

function evHTML(e, day, now) {
  let t;
  if (e.start < day) t = e.end <= addDays(day, 1) ? 'til ' + fmtT(e.end) : 'Hele dagen';
  else t = fmtT(e.start) + (e.end > e.start ? '–' + (e.end < addDays(day, 1) ? fmtT(e.end) : '') : '');
  const past = e.end <= now;
  const cur = e.start <= now && e.end > now;
  return `<div class="ev${past ? ' past' : ''}${cur ? ' now' : ''}">
    <div class="bar" style="background:${esc(e.color)}"></div>
    <div><div class="t">${cur ? 'Nå · ' : ''}${esc(t)}</div><div class="n">${esc(e.title)}</div>${e.loc ? `<div class="l">${esc(e.loc)}</div>` : ''}</div>
  </div>`;
}

function dayHTML(day, now) {
  const evs = eventsFor(day);
  const ad = evs.filter(e => e.allDay);
  const timed = evs.filter(e => !e.allDay);
  let h = '';
  if (ad.length) h += '<div class="allday">' + ad.map(e => `<span class="pill" style="background:${esc(e.color)}">${esc(e.title)}</span>`).join('') + '</div>';
  h += timed.map(e => evHTML(e, day, now)).join('');
  return evs.length ? h : '<div class="empty">Ingenting planlagt</div>';
}

function render() {
  const now = new Date();
  const today = sod(now);
  $('todayList').innerHTML = dayHTML(today, now);
  let html = '';
  for (let i = 1; i < S.days; i++) {
    const d = addDays(today, i);
    const label = i === 1 ? 'I morgen' : d.toLocaleDateString('nb-NO', { weekday: 'long' });
    const sub = d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
    html += `<div class="panel day"><h3>${esc(label)}<span>${esc(sub)}</span></h3>${dayHTML(d, now)}</div>`;
  }
  $('days').innerHTML = html;
  renderSync();
}

function renderSync() {
  const el = $('sync');
  if (!S.lastSync) { el.innerHTML = ''; return; }
  const cls = S.syncError ? 'warn' : '';
  el.innerHTML = `<span class="dot ${cls}"></span>${S.syncError ? 'Delvis synk' : 'Synket'} ${fmtT(S.lastSync)}`;
}

let lastDay = sod(new Date()).getTime();
function tick() {
  const now = new Date();
  $('clock').textContent = fmtT(now);
  $('date').innerHTML = esc(now.toLocaleDateString('nb-NO', { weekday: 'long', day: 'numeric', month: 'long' })) +
    `<small>Uke ${isoWeek(now)}</small>`;
  applyTheme();
  const d = sod(now).getTime();
  if (d !== lastDay) { lastDay = d; sync(false); }
}

function applyTheme() {
  let t = S.theme;
  if (t === 'auto') { const h = new Date().getHours(); t = (h >= 21 || h < 6) ? 'dark' : 'light'; }
  document.documentElement.dataset.theme = t;
}

// ---------- Oppsett og innstillinger ----------
function showSetup() {
  const isFile = location.protocol === 'file:';
  $('fileWarn').classList.toggle('hidden', !isFile);
  $('clientId').value = S.clientId;
  $('originTxt').textContent = location.origin;
  $('redirectTxt').textContent = redirectUri();
  const err = $('authErr');
  if (S.authError && S.authError !== 'interaction_required' && S.authError !== 'login_required' && S.authError !== 'consent_required') {
    err.textContent = 'Innloggingen feilet: ' + S.authError;
    err.classList.remove('hidden');
  } else err.classList.add('hidden');
  $('setup').classList.remove('hidden');
}

function openSettings() {
  $('calList').innerHTML = S.calendars.map(c => `
    <label class="cal"><input type="checkbox" value="${esc(c.id)}" ${S.selected.includes(c.id) ? 'checked' : ''}>
    <span class="sw" style="background:${esc(c.color)}"></span><span>${esc(c.name)}</span></label>`).join('') ||
    '<div class="empty">Ingen kalendere funnet</div>';
  $('daysSel').value = String(S.days);
  $('themeSel').value = S.theme;
  $('settings').classList.remove('hidden');
}

function saveSettings() {
  S.selected = [...$('calList').querySelectorAll('input:checked')].map(i => i.value);
  S.days = parseInt($('daysSel').value, 10);
  S.theme = $('themeSel').value;
  LS.set('kk.selected', S.selected); LS.set('kk.days', S.days); LS.set('kk.theme', S.theme);
  $('settings').classList.add('hidden');
  applyTheme();
  sync(false);
}

function authLost() {
  // Prøv stille fornyelse én gang; ellers vis knapp.
  const failedAt = LS.get('kk.silentFailed', 0);
  if (S.clientId && Date.now() - failedAt > 30 * 60 * 1000) login(true);
  else $('banner').classList.remove('hidden');
}

// ---------- Skjerm våken ----------
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); sync(false); } });
document.addEventListener('click', keepAwake);

// ---------- Hendelser ----------
$('loginBtn').onclick = () => {
  const v = $('clientId').value.trim();
  if (!v) { $('clientId').focus(); return; }
  S.clientId = v; LS.set('kk.clientId', v);
  login(false);
};
$('settingsBtn').onclick = () => { if (tokenValid()) openSettings(); else showSetup(); };
$('refreshBtn').onclick = () => sync(true);
$('saveBtn').onclick = saveSettings;
$('logoutBtn').onclick = logout;
$('bannerBtn').onclick = () => login(false);
$('fsBtn').onclick = () => { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); };
$('settings').onclick = e => { if (e.target.id === 'settings') $('settings').classList.add('hidden'); };

// ---------- Start ----------
handleRedirect();
tick();
setInterval(tick, 10 * 1000);
setInterval(() => { if (S.events.length || S.lastSync) render(); }, 60 * 1000);
setInterval(() => sync(false), REFRESH_MS);

if (tokenValid()) {
  $('main').classList.remove('hidden');
  scheduleRenew();
  sync(true);
} else if (S.token && S.clientId) {
  // Utløpt token: forny stille via Google (krever at Google-sesjonen fortsatt er aktiv)
  S.token = null; LS.del('kk.token');
  authLost();
  showSetup();
} else {
  showSetup();
}
})();
</script>
</body>
</html>
